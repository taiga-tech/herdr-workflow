name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        # macOSではプロセス識別(proc_pidinfo)とクレート全体のdarwinビルドを確かめる。
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - uses: Swatinem/rust-cache@v2
      - run: mise run rust:fmt
      - run: mise run rust:clippy
      - run: mise run rust:test

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: mise run docs:test
      - run: mise run docs:audit
      - run: prettier --check "**/*.{md,json,yaml}"
