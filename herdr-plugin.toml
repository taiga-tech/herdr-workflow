id = "herdr-workflow"
name = "Herdr Workflow"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Validate and run .herdr/workflow.yaml task graphs for worktrees"
# Windowsは受け入れ試験(T32)が未実施のため対象から外す。段階Eで検証後に追加する。
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release"]

[[actions]]
id = "validate"
title = "Validate workflow config"
description = "Check .herdr/workflow.yaml for syntax, DAG, and grid errors without running anything"
contexts = ["workspace"]
command = ["target/release/herdr-workflow", "validate"]

[[actions]]
id = "status"
title = "Show workflow runs"
description = "List recent runs recorded in the herdr-workflow state directory"
contexts = ["global", "workspace"]
command = ["target/release/herdr-workflow", "status"]

# 承認済み(`herdr-workflow trust`)のworkflowだけを初期化する。未承認は保留して終了コード3。
[[events]]
on = "worktree.created"
command = ["target/release/herdr-workflow", "hook"]

# 既存checkoutを開いたとき。成功済みの初期化は繰り返さない(受付キーで重複を判定)。
[[events]]
on = "worktree.opened"
command = ["target/release/herdr-workflow", "hook"]

# 外部からworktreeが削除されたとき。そのcheckoutで稼働中のRunを停止する。
[[events]]
on = "worktree.removed"
command = ["target/release/herdr-workflow", "hook"]

[[actions]]
id = "stop"
title = "Stop workflow runs in this workspace"
description = "Stop the owned tasks of active runs in the current workspace (worktrees and panes are kept)"
contexts = ["workspace"]
command = ["target/release/herdr-workflow", "stop", "--current"]

[[actions]]
id = "cleanup-review"
title = "Review workflow cleanup"
description = "Show removal candidates and hold reasons for the latest run in this workspace (nothing is deleted)"
contexts = ["workspace"]
command = ["target/release/herdr-workflow", "cleanup", "plan", "--current"]

# 入力(ブランチ名等)を尋ねてから、Herdr連携でRunを開始する端末画面。
[[panes]]
id = "up"
title = "Start a workflow run"
placement = "popup"
command = ["target/release/herdr-workflow", "up", "--herdr", "--interactive"]
